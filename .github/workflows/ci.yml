name: CI

on:
  push:
    branches: [main]
  pull_request:

# Une nouvelle exécution sur la même branche annule la précédente
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest

    # Même base que docker-compose.yml, lancée comme service à côté du job
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: labtrack
          POSTGRES_USER: labtrack
          POSTGRES_PASSWORD: labtrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U labtrack -d labtrack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    # Valeurs factices réservées à la CI (aucun secret réel)
    env:
      DJANGO_SECRET_KEY: ci-secret-key-non-utilisee-en-production
      JWT_SIGNING_KEY: ci-jwt-signing-key-au-moins-32-caracteres
      DJANGO_ALLOWED_HOSTS: localhost
      POSTGRES_DB: labtrack
      POSTGRES_USER: labtrack
      POSTGRES_PASSWORD: labtrack
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifier la configuration
        run: python manage.py check

      - name: Vérifier qu'aucune migration ne manque
        run: python manage.py makemigrations --check --dry-run

      - name: Lancer les tests
        run: python manage.py test

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci : installe exactement les versions de package-lock.json
      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Vérifier les types et construire
        run: npm run build
